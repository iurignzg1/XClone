query UserByUsername($username: String!) {
  userByUsername(username: $username) {
    id
    username
    displayName
    bio
    cover
    role
    suspended
    followersCount
    followingCount
    followedByMe
  }
}

query UserTweets($username: String!, $limit: Int) {
  userTweets(username: $username, limit: $limit) { ...TweetCard }
}

mutation FollowUser($input: FollowUserInput!) {
  followUser(input: $input)
}

mutation UnfollowUser($input: FollowUserInput!) {
  unfollowUser(input: $input)
}

mutation SuspendUser($input: SuspendUserInput!) {
  suspendUser(input: $input) { id suspended }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) { id username displayName email role }
}

query Followers($username: String!) {
  followers(username: $username) { id username displayName followedByMe }
}

query Following($username: String!) {
  following(username: $username) { id username displayName followedByMe }
}

query SuggestedUsers {
  suggestedUsers(limit: 3) { id username displayName }
}

query UserReplies($username: String!) {
  userReplies(username: $username) { ...TweetCard }
}

query LikedTweets($username: String!) {
  likedTweets(username: $username) { ...TweetCard }
}
