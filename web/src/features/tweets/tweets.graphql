# Campos que o cartão de um tweet mostra; reaproveitado por feed, perfil e criação.
fragment TweetCard on Tweet {
  id
  content
  createdAt
  parentId
  likesCount
  likedByMe
  repliesCount
  author { id username displayName }
}

query Feed($limit: Int, $after: ID) {
  feed(limit: $limit, after: $after) { ...TweetCard }
}

mutation CreateTweet($input: CreateTweetInput!) {
  createTweet(input: $input) { ...TweetCard }
}

mutation DeleteTweet($input: DeleteTweetInput!) {
  deleteTweet(input: $input)
}

mutation ToggleLike($input: ToggleLikeInput!) {
  toggleLike(input: $input) { liked likesCount }
}

query TweetLikes($tweetId: ID!) {
  tweetLikes(tweetId: $tweetId) { id username displayName followedByMe }
}

# Detalhe de um tweet: o tweet em destaque e as respostas diretas a ele.
query Tweet($id: ID!) {
  tweet(id: $id) {
    ...TweetCard
    replies { ...TweetCard }
  }
}
